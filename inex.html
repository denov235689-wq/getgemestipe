<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>🎁 Gift Monitor</title>
<style>
/* ============================================================
   iOS 26 LIQUID GLASS — GLOBAL
   ============================================================ */
* {
  box-sizing: border-box; margin: 0; padding: 0;
  font-family: -apple-system, 'SF Pro Display', 'SF Pro Text',
               'Segoe UI', Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

:root {
  /* Yorug' rejim */
  --bg-grad-1: #e8eef7;
  --bg-grad-2: #dfe7f5;
  --bg-grad-3: #f0e6f5;
  --bg-grad-4: #f5e9e6;

  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-bg-strong: rgba(255, 255, 255, 0.72);
  --glass-bg-soft: rgba(255, 255, 255, 0.35);
  --glass-border: rgba(255, 255, 255, 0.65);
  --glass-border-soft: rgba(255, 255, 255, 0.4);
  --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.12);
  --glass-shadow-lg: 0 20px 60px rgba(31, 38, 135, 0.18);
  --glass-highlight: rgba(255, 255, 255, 0.85);

  --text: #0a0a0a;
  --text-soft: #5a5f6a;
  --text-faint: #8b8f99;

  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.12);
  --up: #30d158;
  --down: #ff3b30;
  --flat: #8e8e93;
}

body.dark {
  --bg-grad-1: #0a0e1a;
  --bg-grad-2: #10142a;
  --bg-grad-3: #1a0f1e;
  --bg-grad-4: #0e0a1a;

  --glass-bg: rgba(30, 35, 50, 0.55);
  --glass-bg-strong: rgba(35, 40, 55, 0.72);
  --glass-bg-soft: rgba(40, 45, 60, 0.35);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-border-soft: rgba(255, 255, 255, 0.08);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --glass-shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
  --glass-highlight: rgba(255, 255, 255, 0.18);

  --text: #f5f5f7;
  --text-soft: #a1a5b0;
  --text-faint: #6b6f7a;

  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, 0.2);
}

html, body {
  min-height: 100%;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, var(--bg-grad-1) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 80% 20%, var(--bg-grad-2) 0%, transparent 55%),
    radial-gradient(ellipse 80% 60% at 50% 90%, var(--bg-grad-3) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 10% 80%, var(--bg-grad-4) 0%, transparent 55%),
    linear-gradient(180deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  transition: color .3s;
  position: relative;
}

/* Suyuq shisha fon uchun "blob"lar */
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%;
  filter: blur(80px); opacity: 0.55; pointer-events: none;
  z-index: 0;
  animation: float 20s ease-in-out infinite;
}
body::before {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #7ac1ff, transparent 70%);
  top: -100px; left: -100px;
}
body::after {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #d99bff, transparent 70%);
  bottom: -150px; right: -150px;
  animation-delay: -10s;
}
body.dark::before { background: radial-gradient(circle, #1e40af, transparent 70%); opacity: 0.4; }
body.dark::after  { background: radial-gradient(circle, #6d28d9, transparent 70%); opacity: 0.35; }

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%      { transform: translate(60px, -40px) scale(1.1); }
  66%      { transform: translate(-40px, 50px) scale(0.95); }
}

/* Liquid Glass asosiy klass */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
  position: relative;
  overflow: hidden;
}
.glass::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg,
    var(--glass-highlight) 0%,
    transparent 40%,
    transparent 60%,
    var(--glass-highlight) 100%);
  opacity: 0.35; pointer-events: none;
  border-radius: inherit;
}

/* ==================== AUTH ==================== */
#authPage {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  position: relative; z-index: 1;
}

.auth-box {
  width: 100%; max-width: 420px;
  border-radius: 32px;
  padding: 44px 32px 36px;
  background: var(--glass-bg);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1.5px solid var(--glass-border);
  box-shadow: var(--glass-shadow-lg),
              inset 0 1.5px 0 var(--glass-highlight),
              inset 0 -1px 0 rgba(0,0,0,0.05);
  position: relative;
  overflow: hidden;
  animation: slideIn .5s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(30px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.auth-box::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg,
    var(--glass-highlight) 0%,
    transparent 100%);
  opacity: 0.5; pointer-events: none;
}

.auth-logo {
  font-size: 64px; text-align: center; margin-bottom: 16px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,.15));
  animation: bounce 2s ease-in-out infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

.auth-box h1 {
  font-size: 26px; font-weight: 800; text-align: center;
  margin-bottom: 6px; letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--text) 0%, var(--text-soft) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.auth-box .sub {
  text-align: center; color: var(--text-soft);
  font-size: 14px; margin-bottom: 28px; font-weight: 500;
}

.auth-tabs {
  display: flex; gap: 4px;
  background: var(--glass-bg-soft);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 4px; border-radius: 14px;
  margin-bottom: 24px;
  border: 1px solid var(--glass-border-soft);
}
.auth-tab {
  flex: 1; padding: 10px; border-radius: 10px; border: none;
  background: transparent; color: var(--text-soft);
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all .3s cubic-bezier(.2,.9,.3,1.2);
  font-family: inherit;
}
.auth-tab.active {
  background: var(--glass-bg-strong);
  color: var(--text);
  box-shadow: 0 2px 8px rgba(0,0,0,.08),
              inset 0 1px 0 var(--glass-highlight);
}

.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 12px; font-weight: 700;
  color: var(--text-soft); margin-bottom: 8px;
  text-transform: uppercase; letter-spacing: .6px;
  padding-left: 4px;
}
.field input {
  width: 100%; padding: 15px 18px;
  border: 1.5px solid var(--glass-border);
  border-radius: 14px;
  background: var(--glass-bg-soft);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--text);
  font-size: 16px;
  font-family: inherit;
  transition: all .25s;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.04);
  -webkit-appearance: none;
}
.field input::placeholder { color: var(--text-faint); }
.field input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--glass-bg-strong);
  box-shadow: 0 0 0 4px var(--accent-soft),
              inset 0 1px 2px rgba(0,0,0,.04);
}
.field .eye { position: relative; }
.field .eye input { padding-right: 50px; }
.field .eye button {
  position: absolute; right: 8px; top: 50%;
  transform: translateY(-50%);
  background: transparent; border: none;
  color: var(--text-soft); cursor: pointer;
  font-size: 18px; padding: 8px 10px;
  border-radius: 10px;
  transition: background .2s;
}
.field .eye button:hover { background: var(--glass-bg-soft); }

.auth-btn {
  width: 100%; padding: 15px; margin-top: 10px;
  background: linear-gradient(135deg, var(--accent) 0%, #0066cc 100%);
  color: #fff; border: none; border-radius: 14px;
  font-size: 16px; font-weight: 700;
  cursor: pointer;
  transition: all .25s cubic-bezier(.2,.9,.3,1.2);
  box-shadow: 0 8px 24px rgba(10,132,255,.35),
              inset 0 1px 0 rgba(255,255,255,.3);
  letter-spacing: .2px;
}
.auth-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(10,132,255,.45), inset 0 1px 0 rgba(255,255,255,.3); }
.auth-btn:active { transform: translateY(0) scale(.98); }

.auth-err { color: var(--down); font-size: 13px; text-align: center;
            margin-top: 14px; min-height: 18px; font-weight: 600; }
.auth-ok  { color: var(--up); font-size: 13px; text-align: center;
            margin-top: 14px; min-height: 18px; font-weight: 600; }
.auth-hint { color: var(--text-faint); font-size: 12px;
             text-align: center; margin-top: 20px; font-weight: 500; }

.theme-toggle-fixed {
  position: fixed;
  top: max(20px, env(safe-area-inset-top));
  right: 20px;
  width: 48px; height: 48px; border-radius: 50%;
  border: 1.5px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  color: var(--text); font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .3s cubic-bezier(.2,.9,.3,1.2);
  box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
  z-index: 100;
}
.theme-toggle-fixed:hover { transform: scale(1.08) rotate(15deg); }
.theme-toggle-fixed:active { transform: scale(.95); }

/* ==================== SAYT ==================== */
#mainPage { display: none; position: relative; z-index: 1; }
#mainPage.active { display: block; }

header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 22px;
  padding-top: max(14px, env(safe-area-inset-top));
  background: var(--glass-bg);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-bottom: 1px solid var(--glass-border);
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
  gap: 12px;
  flex-wrap: wrap;
}
header h1 {
  font-size: 20px; font-weight: 800; letter-spacing: -0.4px;
  display: flex; align-items: center; gap: 8px;
}
.header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.user-badge {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px 6px 6px;
  background: var(--glass-bg-soft);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 100px;
  border: 1px solid var(--glass-border-soft);
  font-size: 13px; font-weight: 700;
}
.user-badge .av {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #0066cc);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  box-shadow: 0 2px 8px rgba(10,132,255,.35);
}
.user-badge .admin-tag {
  font-size: 10px; padding: 2px 8px;
  background: rgba(48,209,88,.18);
  color: var(--up);
  border-radius: 100px;
  font-weight: 800;
  letter-spacing: .5px;
}

.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid var(--glass-border);
  background: var(--glass-bg-soft);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  color: var(--text); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .25s cubic-bezier(.2,.9,.3,1.2);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
}
.icon-btn:hover { transform: scale(1.05); background: var(--glass-bg); }
.icon-btn:active { transform: scale(.95); }
.icon-btn.danger:hover {
  background: var(--down); color: #fff;
  border-color: var(--down);
  box-shadow: 0 4px 16px rgba(255,59,48,.35);
}

.page { display: none; }
.page.active { display: block; animation: fadeIn .35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); }
                    to   { opacity: 1; transform: translateY(0); } }

/* ==================== KATALOG ==================== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px; padding: 24px;
  max-width: 1400px; margin: 0 auto;
  padding-left: max(24px, env(safe-area-inset-left));
  padding-right: max(24px, env(safe-area-inset-right));
}

.card {
  background: var(--glass-bg);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1.5px solid var(--glass-border);
  border-radius: 24px; overflow: hidden;
  cursor: pointer;
  transition: all .35s cubic-bezier(.2,.9,.3,1.2);
  padding-bottom: 16px;
  position: relative;
  box-shadow: var(--glass-shadow),
              inset 0 1.5px 0 var(--glass-highlight);
}
.card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 40%;
  background: linear-gradient(180deg,
    var(--glass-highlight) 0%, transparent 100%);
  opacity: 0.4; pointer-events: none;
  border-radius: 24px 24px 0 0;
}
.card:hover {
  transform: translateY(-6px) scale(1.01);
  box-shadow: var(--glass-shadow-lg),
              inset 0 1.5px 0 var(--glass-highlight);
  border-color: var(--glass-highlight);
}
.card:active { transform: translateY(-2px) scale(.99); }

.img-wrap {
  height: 170px; display: flex;
  align-items: center; justify-content: center;
  background: var(--glass-bg-soft);
  margin: 8px; border-radius: 18px;
  position: relative; z-index: 1;
}
.img-wrap img {
  max-height: 100%; max-width: 100%;
  object-fit: contain; padding: 16px;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,.15));
  transition: transform .4s;
}
.card:hover .img-wrap img { transform: scale(1.08); }
.placeholder { font-size: 64px; opacity: .9; }

.info { padding: 6px 20px 0; position: relative; z-index: 1; }
.info h3 {
  font-size: 16px; font-weight: 800;
  margin-bottom: 12px; letter-spacing: -0.2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.price-row {
  display: flex; justify-content: space-between;
  align-items: center; gap: 8px;
}
.price {
  font-size: 22px; font-weight: 900;
  color: var(--text); letter-spacing: -0.6px;
}
.change {
  font-size: 12px; font-weight: 800;
  padding: 5px 10px; border-radius: 100px;
  white-space: nowrap;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid;
}
.change.up {
  color: var(--up); background: rgba(48,209,88,.12);
  border-color: rgba(48,209,88,.25);
}
.change.down {
  color: var(--down); background: rgba(255,59,48,.12);
  border-color: rgba(255,59,48,.25);
}
.change.flat {
  color: var(--flat); background: rgba(142,142,147,.12);
  border-color: rgba(142,142,147,.25);
}
.count {
  font-size: 12px; color: var(--text-soft);
  margin-top: 12px; font-weight: 600;
}

/* ==================== MODAL ==================== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  display: none; align-items: center; justify-content: center;
  padding: 20px; z-index: 200;
  padding-top: max(20px, env(safe-area-inset-top));
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  animation: fadeIn .25s;
}
.modal-overlay.active { display: flex; }

.modal {
  background: var(--glass-bg-strong);
  backdrop-filter: blur(50px) saturate(180%);
  -webkit-backdrop-filter: blur(50px) saturate(180%);
  border: 1.5px solid var(--glass-border);
  border-radius: 32px;
  width: 100%; max-width: 900px;
  max-height: 90vh; overflow-y: auto;
  padding: 32px; position: relative;
  box-shadow: 0 30px 100px rgba(0,0,0,.4),
              inset 0 1.5px 0 var(--glass-highlight);
  animation: modalPop .4s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes modalPop {
  from { opacity: 0; transform: translateY(30px) scale(.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal::-webkit-scrollbar { width: 6px; }
.modal::-webkit-scrollbar-thumb {
  background: var(--glass-border); border-radius: 3px;
}

.modal-close {
  position: absolute; top: 20px; right: 20px;
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid var(--glass-border);
  color: var(--text); font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .25s;
  box-shadow: inset 0 1px 0 var(--glass-highlight);
}
.modal-close:hover {
  background: var(--down); color: #fff;
  border-color: var(--down);
  transform: rotate(90deg) scale(1.05);
}

.modal-header {
  display: flex; gap: 22px; align-items: center;
  margin-bottom: 28px; flex-wrap: wrap;
}
.modal-img {
  width: 120px; height: 120px; border-radius: 24px;
  background: var(--glass-bg-soft);
  border: 1px solid var(--glass-border-soft);
  display: flex; align-items: center;
  justify-content: center; flex-shrink: 0;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.modal-img img {
  max-width: 100%; max-height: 100%;
  object-fit: contain; padding: 14px;
}
.modal-img .placeholder { font-size: 56px; }
.modal-info h2 {
  font-size: 26px; font-weight: 900;
  margin-bottom: 10px; letter-spacing: -0.6px;
}
.modal-info .cur-price {
  font-size: 34px; font-weight: 900;
  letter-spacing: -1px;
  background: linear-gradient(135deg, var(--accent), #0066cc);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.modal-info .meta {
  color: var(--text-soft); font-size: 13px;
  margin-top: 10px; font-weight: 600;
}

.chart-tabs {
  display: flex; gap: 4px;
  background: var(--glass-bg-soft);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 4px; border-radius: 14px;
  margin-bottom: 22px; width: fit-content;
  border: 1px solid var(--glass-border-soft);
}
.chart-tab {
  padding: 10px 20px; border-radius: 10px; border: none;
  background: transparent; color: var(--text-soft);
  font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: all .25s;
}
.chart-tab.active {
  background: var(--glass-bg-strong);
  color: var(--text);
  box-shadow: 0 2px 8px rgba(0,0,0,.08),
              inset 0 1px 0 var(--glass-highlight);
}

.chart-container {
  background: var(--glass-bg-soft);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border-soft);
  border-radius: 20px;
  padding: 28px 22px 22px; position: relative; overflow: hidden;
}
.big-bars {
  display: flex; gap: 10px; align-items: flex-end;
  height: 280px; overflow-x: auto; padding: 0 6px;
  position: relative; z-index: 1;
}
.big-bars::-webkit-scrollbar { height: 6px; }
.big-bars::-webkit-scrollbar-thumb {
  background: var(--glass-border); border-radius: 3px;
}
.bb-item {
  display: flex; flex-direction: column; align-items: center;
  min-width: 60px; flex: 1;
  justify-content: flex-end; height: 100%;
}
.bb-bar {
  width: 100%; max-width: 44px;
  border-radius: 8px 8px 4px 4px;
  transition: all .4s cubic-bezier(.2,.9,.3,1.2);
  min-height: 8px;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
  position: relative;
}
.bb-bar::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 40%;
  background: linear-gradient(180deg, rgba(255,255,255,.4), transparent);
  border-radius: 8px 8px 0 0;
  pointer-events: none;
}
.bb-bar.up   { background: linear-gradient(180deg, #34d967, #30d158); }
.bb-bar.down { background: linear-gradient(180deg, #ff5757, #ff3b30); }
.bb-bar.flat { background: linear-gradient(180deg, #a1a5b0, #8e8e93); }

.bb-val {
  font-size: 12px; font-weight: 800;
  margin-bottom: 6px; white-space: nowrap;
  color: var(--text);
}
.bb-item.up   .bb-val { color: var(--up); }
.bb-item.down .bb-val { color: var(--down); }
.bb-label {
  font-size: 10px; color: var(--text-soft);
  margin-top: 10px; font-weight: 700;
  text-align: center; line-height: 1.3;
}

.chart-grid {
  position: absolute; inset: 28px 22px 55px 22px;
  pointer-events: none; z-index: 0;
}
.grid-line {
  position: absolute; left: 0; right: 0;
  border-top: 1px dashed var(--glass-border);
}
.grid-label {
  position: absolute; left: 0;
  font-size: 10px; color: var(--text-soft);
  background: var(--glass-bg-soft);
  padding: 2px 8px; transform: translateY(-50%);
  border-radius: 100px; font-weight: 700;
}

.legend {
  display: flex; gap: 20px; flex-wrap: wrap;
  margin-top: 24px; padding-top: 20px;
  border-top: 1px solid var(--glass-border-soft);
}
.legend-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-soft);
  font-weight: 700;
}
.legend-dot {
  width: 14px; height: 14px; border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.legend-dot.up   { background: linear-gradient(180deg, #34d967, #30d158); }
.legend-dot.down { background: linear-gradient(180deg, #ff5757, #ff3b30); }
.legend-dot.flat { background: linear-gradient(180deg, #a1a5b0, #8e8e93); }

.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px; margin-top: 24px;
}
.sum-item {
  background: var(--glass-bg-soft);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border-soft);
  border-radius: 16px; padding: 16px;
  box-shadow: inset 0 1px 0 var(--glass-highlight);
}
.sum-item .lbl {
  font-size: 10px; color: var(--text-soft);
  text-transform: uppercase; letter-spacing: .8px;
  font-weight: 800; margin-bottom: 8px;
}
.sum-item .val {
  font-size: 20px; font-weight: 900;
  letter-spacing: -0.4px;
}
.sum-item .val.up   { color: var(--up); }
.sum-item .val.down { color: var(--down); }

/* ==================== ADMIN PANEL ==================== */
.wrap {
  max-width: 1200px; margin: 0 auto; padding: 24px;
  padding-left: max(24px, env(safe-area-inset-left));
  padding-right: max(24px, env(safe-area-inset-right));
}
.panel {
  background: var(--glass-bg);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1.5px solid var(--glass-border);
  border-radius: 24px;
  padding: 26px; margin-bottom: 20px;
  box-shadow: var(--glass-shadow),
              inset 0 1px 0 var(--glass-highlight);
}
.panel h2 {
  font-size: 17px; font-weight: 800;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px;
  letter-spacing: -0.3px;
}

input, button, select {
  padding: 13px 16px;
  border-radius: 14px;
  border: 1.5px solid var(--glass-border);
  background: var(--glass-bg-soft);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: var(--text);
  font-size: 15px; font-family: inherit;
  transition: all .25s;
  -webkit-appearance: none;
}
input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--glass-bg-strong);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
button {
  background: linear-gradient(135deg, var(--accent), #0066cc);
  color: #fff; border-color: transparent;
  cursor: pointer; font-weight: 700;
  box-shadow: 0 4px 16px rgba(10,132,255,.35),
              inset 0 1px 0 rgba(255,255,255,.3);
}
button:hover { transform: translateY(-1px); }
button:active { transform: translateY(0) scale(.98); }
button.danger {
  background: linear-gradient(135deg, #ff5757, #ff3b30);
  border-color: transparent;
  color: #fff; padding: 9px 14px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(255,59,48,.35);
}
button.ghost {
  background: var(--glass-bg-soft);
  color: var(--text-soft);
  border: 1.5px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
}
button.ghost:hover {
  background: var(--glass-bg);
  color: var(--text);
}

form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
form input { flex: 1; min-width: 160px; }
form input[type=file] {
  padding: 11px; color: var(--text-soft); font-size: 13px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
}
.stat-box {
  background: var(--glass-bg-soft);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid var(--glass-border-soft);
  border-radius: 18px; padding: 22px; text-align: center;
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  transition: all .3s;
}
.stat-box:hover { transform: translateY(-3px); }
.stat-box .val {
  font-size: 34px; font-weight: 900;
  letter-spacing: -1.2px;
  background: linear-gradient(135deg, var(--accent), #0066cc);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.stat-box .lbl {
  font-size: 11px; color: var(--text-soft);
  margin-top: 8px;
  text-transform: uppercase; letter-spacing: .8px;
  font-weight: 800;
}

table { width: 100%; border-collapse: collapse; }
th, td {
  padding: 14px 10px; text-align: left;
  border-bottom: 1px solid var(--glass-border-soft);
  font-size: 14px;
}
th {
  color: var(--text-soft); font-size: 11px;
  text-transform: uppercase; letter-spacing: .8px;
  font-weight: 800;
}
td img { max-height: 48px; border-radius: 10px; }
td input[type=number] {
  width: 100px; padding: 9px 12px; font-size: 14px;
}

.empty {
  text-align: center; padding: 90px 20px;
  color: var(--text-soft);
}
.empty p { margin-top: 12px; font-size: 16px; font-weight: 600; }

.user-row {
  display: flex; justify-content: space-between;
  align-items: center; padding: 14px 0;
  border-bottom: 1px solid var(--glass-border-soft);
}
.user-row:last-child { border-bottom: none; }
.user-row .uinfo { display: flex; align-items: center; gap: 14px; }
.user-row .av {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #0066cc);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 16px;
  box-shadow: 0 4px 12px rgba(10,132,255,.35);
}
.user-row .name { font-weight: 800; font-size: 15px; }
.user-row .meta {
  font-size: 12px; color: var(--text-soft);
  margin-top: 3px; font-weight: 600;
}

/* ==================== TOAST ==================== */
.toast {
  position: fixed;
  bottom: max(24px, env(safe-area-inset-bottom));
  right: 24px; left: 24px;
  max-width: 400px;
  margin-left: auto;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1.5px solid var(--glass-border);
  color: var(--text);
  padding: 16px 24px;
  border-radius: 18px;
  font-weight: 700; font-size: 14px;
  opacity: 0; transition: all .35s cubic-bezier(.2,.9,.3,1.2);
  pointer-events: none; z-index: 1000;
  box-shadow: var(--glass-shadow-lg),
              inset 0 1px 0 var(--glass-highlight);
  transform: translateY(20px);
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ==================== MOBIL / iPhone ==================== */
@media (max-width: 700px) {
  header { padding: 12px 16px; gap: 10px; }

  .header-actions { gap: 6px; }

  }

  .modal-info .cur-price { font-size: 28px; }

  .bb-item { min-width: 48px; }
  .bb-bar { max-width: 36px; }
  .stat-box .val { font-size: 28px; }
  .chart-tabs { overflow-x: auto; max-width: 100%; }
}

/* iPhone notch / Dynamic Island uchun */
@supports (padding: env(safe-area-inset-top)) {
  header {
    padding-top: max(14px, env(safe-area-inset-top));
  }
  .wrap {
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
}
</style>

<body>

<!-- ==================== AUTH ==================== -->
<div id="authPage">
  <button class="theme-toggle-fixed" onclick="toggleTheme()" id="themeBtnAuth">🌙</button>
  <div class="auth-box">
    <div class="auth-logo">🎁</div>
    <h1>Gift Monitor</h1>
    <p class="sub" id="authSub">Tizimga kirish</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">🔑 Kirish</button>
      <button class="auth-tab" id="tabRegister" onclick="switchAuth('register')">📝 Ro'yxat</button>
    </div>

    <div id="loginForm">
      <div class="field">
        <label>Login</label>
        <input type="text" id="loginUser" placeholder="Login kiriting"
               autocomplete="username"
               onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="field">
        <label>Parol</label>
        <div class="eye">
          <input type="password" id="loginPass" placeholder="Parol kiriting"
                 autocomplete="current-password"
                 onkeydown="if(event.key==='Enter')doLogin()">
          <button type="button" onclick="togglePass('loginPass', this)">👁</button>
        </div>
      </div>
      <button class="auth-btn" onclick="doLogin()">Kirish →</button>
      <p class="auth-err" id="loginErr"></p>
    </div>

    <div id="registerForm" style="display:none">
      <div class="field">
        <label>Login</label>
        <input type="text" id="regUser" placeholder="Login (min 3 belgi)"
               autocomplete="username"
               onkeydown="if(event.key==='Enter')doRegister()">
      </div>
      <div class="field">
        <label>Parol</label>
        <div class="eye">
          <input type="password" id="regPass" placeholder="Parol (min 4 belgi)"
                 autocomplete="new-password"
                 onkeydown="if(event.key==='Enter')doRegister()">
          <button type="button" onclick="togglePass('regPass', this)">👁</button>
        </div>
      </div>
      <div class="field">
        <label>Parolni takrorlang</label>
        <div class="eye">
          <input type="password" id="regPass2" placeholder="Parolni qayta kiriting"
                 autocomplete="new-password"
                 onkeydown="if(event.key==='Enter')doRegister()">
          <button type="button" onclick="togglePass('regPass2', this)">👁</button>
        </div>
      </div>
      <button class="auth-btn" onclick="doRegister()">Ro'yxatdan o'tish →</button>
      <p class="auth-err" id="regErr"></p>
      <p class="auth-ok" id="regOk"></p>
    </div>

    <p class="auth-hint" id="authHint">
      Hisobingiz yo'qmi? <b>Ro'yxatdan o'ting</b>
    </p>
  </div>
</div>

<!-- ==================== SAYT ==================== -->
<div id="mainPage">
  <header>
    <h1>🎁 Gift Narxlar</h1>
    <div class="header-actions">
      <div class="user-badge">
        <div class="av" id="userAv">U</div>
        <span class="name" id="userName">user</span>
        <span class="admin-tag" id="adminTag" style="display:none">ADMIN</span>
      </div>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Rejim">🌙</button>
      <button class="icon-btn danger" onclick="logout()" title="Chiqish">⏻</button>
    </div>
  </header>

  <!-- KATALOG -->
  <div class="page active" id="pageHome">
    <div class="grid" id="grid"></div>
    <div id="emptyBox"></div>
  </div>

  <!-- ADMIN PANEL — faqat admin kirsa ko'rinadi -->
  <div class="page" id="pageAdmin">
    <div class="wrap">
      <div class="panel">
        <h2>➕ Yangi Gift qo'shish</h2>
        <form id="addForm" onsubmit="addGift(event)">
          <input name="name" placeholder="🎁 Nomi" required>
          <input name="base_price" type="number" step="0.01" placeholder="💰 Narx (stars)" required>
          <input name="count" type="number" placeholder="📦 Soni" value="0">
          <input name="image" type="file" accept="image/*">
          <button type="submit">➕ Qo'shish</button>
        </form>
      </div>

      <div class="panel">
        <h2>📊 Statistika</h2>
        <div class="stats" id="stats"></div>
      </div>

      <div class="panel">
        <h2>🎁 Giftlar ro'yxati</h2>
        <div style="overflow-x:auto">
          <table id="giftTable">
            <thead>
              <tr>
                <th>Rasm</th><th>Nomi</th><th>Boshlang'ich</th>
                <th>Joriy narx</th><th>Soni</th><th>Amal</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h2>👥 Foydalanuvchilar</h2>
        <div id="usersList"></div>
      </div>

      <div class="panel">
        <h2>⚙️ Boshqa amallar</h2>
        <button class="ghost" onclick="exportData()">⬇️ Backup</button>
        <button class="danger" onclick="clearAll()">🗑 Hammasini o'chirish</button>
      </div>
    </div>
  </div>
</div>

<!-- ==================== MODAL ==================== -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   ADMIN — KIRISHDA LOGIN/PAROL ORQALI AVTOMATIK ANIQLANADI
   ============================================================ */
const ADMIN_LOGIN    = "admin1234";
const ADMIN_PASSWORD = "admin1234";

/* ============================================================
   SOZLAMALAR
   ============================================================ */
const LS_USERS  = "gm_users";
const LS_GIFTS  = "gm_gifts";
const LS_VISITS = "gm_visits";
const LS_AUTH   = "gm_auth";
const LS_THEME  = "gm_theme";

let currentModalGiftId = null;
let currentChartMode = "day";

/* ============================================================
   AUTH
   ============================================================ */
function switchAuth(mode) {
  const isLogin = mode === "login";
  document.getElementById("tabLogin").classList.toggle("active", isLogin);
  document.getElementById("tabRegister").classList.toggle("active", !isLogin);
  document.getElementById("loginForm").style.display = isLogin ? "block" : "none";
  document.getElementById("registerForm").style.display = isLogin ? "none" : "block";
  document.getElementById("authSub").innerText = isLogin ? "Tizimga kirish" : "Yangi hisob yaratish";
  document.getElementById("authHint").innerHTML = isLogin
    ? `Hisobingiz yo'qmi? <b>Ro'yxatdan o'ting</b>`
    : `Hisobingiz bormi? <b>Kirish</b>`;
}

function togglePass(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === "password" ? "text" : "password";
  btn.innerText = inp.type === "password" ? "👁" : "🙈";
}

function loadUsers() {
  try { return JSON.parse(localStorage.getItem(LS_USERS)) || []; } catch { return []; }
}
function saveUsers(u) { localStorage.setItem(LS_USERS, JSON.stringify(u)); }

function doRegister() {
  const u = document.getElementById("regUser").value.trim();
  const p = document.getElementById("regPass").value;
  const p2 = document.getElementById("regPass2").value;
  const err = document.getElementById("regErr");
  const ok  = document.getElementById("regOk");
  err.innerText = ""; ok.innerText = "";

  if (u.length < 3) { err.innerText = "❌ Login kamida 3 belgi!"; return; }
  if (p.length < 4) { err.innerText = "❌ Parol kamida 4 belgi!"; return; }
  if (p !== p2)     { err.innerText = "❌ Parollar mos emas!"; return; }

  // Admin login bilan bir xil bo'lmasin
  if (u.toLowerCase() === ADMIN_LOGIN.toLowerCase()) {
    err.innerText = "❌ Bu login band!"; return;
  }

  const users = loadUsers();
  if (users.some(x => x.username.toLowerCase() === u.toLowerCase())) {
    err.innerText = "❌ Bu login band!"; return;
  }

  users.push({ username: u, password: p, created_at: new Date().toISOString() });
  saveUsers(users);

  ok.innerText = "✅ Muvaffaqiyat! Kirishga o'tilmoqda...";
  setTimeout(() => {
    document.getElementById("loginUser").value = u;
    document.getElementById("regUser").value = "";
    document.getElementById("regPass").value = "";
    document.getElementById("regPass2").value = "";
    switchAuth("login");
    document.getElementById("loginPass").focus();
  }, 800);
}

/* ============================================================
   LOGIN — ADMIN avtomatik aniqlanadi
   ============================================================ */
function doLogin() {
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  const err = document.getElementById("loginErr");
  err.innerText = "";

  if (!u || !p) { err.innerText = "❌ Login va parolni kiriting!"; return; }

  // 1) ADMIN tekshirish
  if (u === ADMIN_LOGIN && p === ADMIN_PASSWORD) {
    sessionStorage.setItem(LS_AUTH, JSON.stringify({
      username: u,
      is_admin: true
    }));
    openMain();
    toast("🔓 Admin sifatida kirdingiz");
    return;
  }

  // 2) Oddiy foydalanuvchi
  const users = loadUsers();
  const found = users.find(x =>
    x.username.toLowerCase() === u.toLowerCase() && x.password === p
  );
  if (!found) {
    err.innerText = "❌ Login yoki parol xato!";
    document.getElementById("loginPass").value = "";
    return;
  }

  sessionStorage.setItem(LS_AUTH, JSON.stringify({
    username: found.username,
    is_admin: false
  }));
  openMain();
  toast("✅ Xush kelibsiz, " + found.username + "!");
}

function logout() {
  if (!confirm("Chiqishni tasdiqlaysizmi?")) return;
  sessionStorage.removeItem(LS_AUTH);
  document.getElementById("mainPage").classList.remove("active");
  document.getElementById("authPage").style.display = "flex";
  document.getElementById("loginUser").value = "";
  document.getElementById("loginPass").value = "";
  document.getElementById("loginErr").innerText = "";
  switchAuth("login");
}

function openMain() {
  document.getElementById("authPage").style.display = "none";
  document.getElementById("mainPage").classList.add("active");

  const auth = JSON.parse(sessionStorage.getItem(LS_AUTH) || "{}");
  const name = auth.username || "user";
  const isAdmin = !!auth.is_admin;

  document.getElementById("userName").innerText = name;
  document.getElementById("userAv").innerText = name[0].toUpperCase();

  // ADMIN belgisi
  const adminTag = document.getElementById("adminTag");
  if (isAdmin) {
    adminTag.style.display = "inline-block";
  } else {
    adminTag.style.display = "none";
  }

  // Ko'rinish: admin bo'lsa — admin panel; oddiy — katalog
  if (isAdmin) {
    document.getElementById("pageAdmin").classList.add("active");
    document.getElementById("pageHome").classList.remove("active");
    renderGiftTable();
    loadStats();
    renderUsers();
  } else {
    document.getElementById("pageHome").classList.add("active");
    document.getElementById("pageAdmin").classList.remove("active");
  }

  renderCatalog();
}

/* ============================================================
   TEMA
   ============================================================ */
function applyTheme(theme) {
  const isDark = theme === "dark";
  document.body.classList.toggle("dark", isDark);
  const btn = document.getElementById("themeBtn");
  const btnAuth = document.getElementById("themeBtnAuth");
  if (btn) btn.innerText = isDark ? "☀️" : "🌙";
  if (btnAuth) btnAuth.innerText = isDark ? "☀️" : "🌙";
  localStorage.setItem(LS_THEME, theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = isDark ? "#0a0e1a" : "#e8eef7";
}
function toggleTheme() {
  const cur = localStorage.getItem(LS_THEME) || "light";
  applyTheme(cur === "dark" ? "light" : "dark");
}

/* ============================================================
   YORDAMCHI
   ============================================================ */
function loadGifts() {
  try { return JSON.parse(localStorage.getItem(LS_GIFTS)) || []; } catch { return []; }
}
function saveGifts(g) { localStorage.setItem(LS_GIFTS, JSON.stringify(g)); }

function dayKey(d) {
  const x = new Date(d);
  return x.getFullYear() + "-" +
    String(x.getMonth()+1).padStart(2,"0") + "-" +
    String(x.getDate()).padStart(2,"0");
}
function monthKey(d) {
  const x = new Date(d);
  return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0");
}
function hourKey(d) {
  const x = new Date(d);
  return dayKey(x) + " " + String(x.getHours()).padStart(2,"0");
}
const UZ_MONTHS = ["Yan","Fev","Mar","Apr","May","Iyn","Iyl","Avg","Sen","Okt","Noy","Dek"];

function trackVisit() {
  let v = JSON.parse(localStorage.getItem(LS_VISITS)) || [];
  v.push({ date: new Date().toISOString() });
  if (v.length > 1000) v = v.slice(-1000);
  localStorage.setItem(LS_VISITS, JSON.stringify(v));
}

/* ============================================================
   KATALOG
   ============================================================ */
function renderCatalog() {
  const gifts = loadGifts();
  const grid = document.getElementById("grid");
  const emptyBox = document.getElementById("emptyBox");
  if (!grid) return;
  grid.innerHTML = "";
  emptyBox.innerHTML = "";

  if (!gifts.length) {
    emptyBox.innerHTML = `
      <div class="empty">
        <div style="font-size:70px">🎁</div>
        <p>Hozircha giftlar yo'q.</p>
        <p style="font-size:13px;margin-top:8px;color:var(--text-faint)">
          Admin kirmaguncha hech narsa qo'shilmaydi
        </p>
      </div>`;
    return;
  }

  gifts.forEach(g => {
    const history = g.history || [];
    const last = history.length >= 2 ? history[history.length-2].price : g.base_price;
    let change = 0;
    if (last > 0) change = ((g.current_price - last) / last) * 100;

    let arrow, cls;
    if (change > 0.01)       { arrow = "▲"; cls = "up"; }
    else if (change < -0.01) { arrow = "▼"; cls = "down"; }
    else                     { arrow = "●"; cls = "flat"; }

    const imgHtml = g.image
      ? `<img src="${g.image}" alt="${g.name}">`
      : `<div class="placeholder">🎁</div>`;

    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openGiftModal(g.id);
    card.innerHTML = `
      <div class="img-wrap">${imgHtml}</div>
      <div class="info">
        <h3>${g.name}</h3>
        <div class="price-row">
          <span class="price">${Math.round(g.current_price)} ⭐</span>
          <span class="change ${cls}">${arrow} ${Math.abs(change).toFixed(1)}%</span>
        </div>
        <div class="count">📦 Soni: ${g.count} ta</div>
      </div>`;
    grid.appendChild(card);
  });
}

/* ============================================================
   MODAL
   ============================================================ */
function openGiftModal(id) {
  const g = loadGifts().find(x => x.id === id);
  if (!g) return;
  currentModalGiftId = id;
  currentChartMode = "day";
  renderModal(g);
  document.getElementById("modalOverlay").classList.add("active");
}
function closeModal() {
  document.getElementById("modalOverlay").classList.remove("active");
  currentModalGiftId = null;
}

function renderModal(g) {
  const history = g.history || [];
  const imgHtml = g.image
    ? `<img src="${g.image}" alt="${g.name}">`
    : `<div class="placeholder">🎁</div>`;

  const first = history[0]?.price ?? g.base_price;
  const last = history[history.length-1]?.price ?? g.current_price;
  const totalChange = first > 0 ? ((last - first) / first) * 100 : 0;
  const prices = history.map(h => h.price);
  const maxP = Math.max(...prices, g.current_price, 1);
  const minP = Math.min(...prices, g.current_price);

  const html = `
    <div class="modal-header">
      <div class="modal-img">${imgHtml}</div>
      <div class="modal-info" style="flex:1">
        <h2>${g.name}</h2>
        <div class="cur-price">${Math.round(g.current_price)} ⭐</div>
        <div class="meta">
          📦 Soni: ${g.count} ta · 📅 ${history.length} ta yozuv
        </div>
      </div>
    </div>

    <div class="chart-tabs">
      <button class="chart-tab active" data-mode="day"   onclick="setChartMode('day')">📅 Kunlik</button>
      <button class="chart-tab" data-mode="hour"  onclick="setChartMode('hour')">🕐 Soatlik</button>
      <button class="chart-tab" data-mode="month" onclick="setChartMode('month')">📆 Oylik</button>
    </div>

    <div class="chart-container" id="chartContainer"></div>

    <div class="legend">
      <div class="legend-item"><div class="legend-dot up"></div> Narx ko'tarilgan</div>
      <div class="legend-item"><div class="legend-dot down"></div> Narx tushgan</div>
      <div class="legend-item"><div class="legend-dot flat"></div> O'zgarmagan</div>
    </div>

    <div class="summary">
      <div class="sum-item">
        <div class="lbl">Boshlang'ich</div>
        <div class="val">${Math.round(first)} ⭐</div>
      </div>
      <div class="sum-item">
        <div class="lbl">Joriy</div>
        <div class="val">${Math.round(last)} ⭐</div>
      </div>
      <div class="sum-item">
        <div class="lbl">Jami o'zgarish</div>
        <div class="val ${totalChange > 0 ? "up" : totalChange < 0 ? "down" : ""}">
          ${totalChange > 0 ? "+" : ""}${totalChange.toFixed(1)}%
        </div>
      </div>
      <div class="sum-item">
        <div class="lbl">Eng yuqori</div>
        <div class="val up">${Math.round(maxP)} ⭐</div>
      </div>
      <div class="sum-item">
        <div class="lbl">Eng past</div>
        <div class="val down">${Math.round(minP)} ⭐</div>
      </div>
    </div>
  `;
  document.getElementById("modalContent").innerHTML = html;
  renderChart(g, currentChartMode);
}

function setChartMode(mode) {
  currentChartMode = mode;
  document.querySelectorAll(".chart-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.mode === mode);
  });
  const g = loadGifts().find(x => x.id === currentModalGiftId);
  if (g) renderChart(g, mode);
}

/* ============================================================
   CHART
   ============================================================ */
function renderChart(g, mode) {
  const history = g.history || [];
  const container = document.getElementById("chartContainer");
  if (!container) return;

  if (!history.length) {
    container.innerHTML = `<div style="text-align:center;color:var(--text-soft);padding:40px">Tarix yo'q</div>`;
    return;
  }

  let groups = {};
  history.forEach(h => {
    let key;
    if (mode === "hour")       key = hourKey(h.date);
    else if (mode === "month") key = monthKey(h.date);
    else                       key = dayKey(h.date);
    if (!groups[key]) groups[key] = [];
    groups[key].push(h.price);
  });

  let points = Object.keys(groups).sort().map(k => {
    const prices = groups[k];
    return { key: k, price: prices[prices.length - 1] };
  });
  points = points.slice(-30);

  points.forEach((p, i) => {
    if (i === 0) {
      const base = g.base_price;
      p.diff = base > 0 ? ((p.price - base) / base) * 100 : 0;
    } else {
      const prev = points[i-1].price;
      p.diff = prev > 0 ? ((p.price - prev) / prev) * 100 : 0;
    }
    if (p.diff > 0.01) p.dir = "up";
    else if (p.diff < -0.01) p.dir = "down";
    else p.dir = "flat";
  });

  const prices = points.map(p => p.price);
  const maxP = Math.max(...prices, g.current_price, 1);
  const minP = Math.min(...prices, g.current_price);
  const range = maxP - minP || 1;

  function makeLabel(key) {
    if (mode === "hour") {
      const [date, hour] = key.split(" ");
      const [,m,d] = date.split("-");
      return `${d}.${m} ${hour}:00`;
    }
    if (mode === "month") {
      const [y, m] = key.split("-");
      return UZ_MONTHS[parseInt(m)-1] + " " + y.slice(2);
    }
    const [,m,d] = key.split("-");
    return `${d}.${m}`;
  }

  let barsHtml = "";
  points.forEach(p => {
    const heightPct = 15 + ((p.price - minP) / range) * 85;
    barsHtml += `
      <div class="bb-item ${p.dir}">
        <div class="bb-val">${Math.round(p.price)}</div>
        <div class="bb-bar ${p.dir}" style="height:${heightPct}%"></div>
        <div class="bb-label">${makeLabel(p.key)}</div>
      </div>`;
  });

  let gridHtml = "";
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const pct = (i / steps) * 100;
    const val = maxP - (i / steps) * range;
    gridHtml += `
      <div class="grid-line" style="top:${100 - pct}%">
        <span class="grid-label">${Math.round(val)}</span>
      </div>`;
  }

  container.innerHTML = `
    <div class="chart-grid">${gridHtml}</div>
    <div class="big-bars">${barsHtml}</div>
  `;
}

/* ============================================================
   STATISTIKA
   ============================================================ */
function loadStats() {
  const visits = JSON.parse(localStorage.getItem(LS_VISITS)) || [];
  const gifts = loadGifts();
  const users = loadUsers();
  const t = dayKey(new Date());
  const todayCount = visits.filter(v => v.date.startsWith(t)).length;
  const activeDays = new Set(visits.map(v => v.date.slice(0,10))).size;

  const statsEl = document.getElementById("stats");
  if (!statsEl) return;
  statsEl.innerHTML = `
    <div class="stat-box"><div class="val">${visits.length}</div><div class="lbl">Jami kirish</div></div>
    <div class="stat-box"><div class="val">${todayCount}</div><div class="lbl">Bugun</div></div>
    <div class="stat-box"><div class="val">${gifts.length}</div><div class="lbl">Giftlar</div></div>
    <div class="stat-box"><div class="val">${users.length}</div><div class="lbl">Foydalanuvchi</div></div>
    <div class="stat-box"><div class="val">${activeDays}</div><div class="lbl">Faol kunlar</div></div>`;
}

/* ============================================================
   FOYDALANUVCHILAR
   ============================================================ */
function renderUsers() {
  const users = loadUsers();
  const box = document.getElementById("usersList");
  if (!box) return;

  if (!users.length) {
    box.innerHTML = `<div style="text-align:center;color:var(--text-soft);padding:20px">Foydalanuvchilar yo'q</div>`;
    return;
  }

  box.innerHTML = users.map(u => {
    const dt = new Date(u.created_at);
    const dateStr = dt.toLocaleDateString("uz-UZ") + " " +
                    dt.toLocaleTimeString("uz-UZ", {hour:"2-digit",minute:"2-digit"});
    return `
      <div class="user-row">
        <div class="uinfo">
          <div class="av">${u.username[0].toUpperCase()}</div>
          <div>
            <div class="name">${u.username}</div>
            <div class="meta">📅 ${dateStr}</div>
          </div>
        </div>
        <button class="danger" onclick="delUser('${u.username}')">🗑</button>
      </div>`;
  }).join("");
}

function delUser(username) {
  if (!confirm(`"${username}" ni o'chirmoqchimisiz?`)) return;
  let users = loadUsers();
  users = users.filter(u => u.username !== username);
  saveUsers(users);
  renderUsers(); loadStats();
  toast("🗑 Foydalanuvchi o'chirildi");
}

/* ============================================================
   GIFT QO'SHISH
   ============================================================ */
function addGift(e) {
  e.preventDefault();
  const form = document.getElementById("addForm");
  const fd = new FormData(form);
  const name = fd.get("name").trim();
  const basePrice = parseFloat(fd.get("base_price"));
  const count = parseInt(fd.get("count")) || 0;
  const file = fd.get("image");

  const save = (imageData) => {
    const gifts = loadGifts();
    gifts.push({
      id: Date.now(),
      name, base_price: basePrice,
      current_price: basePrice, count,
      image: imageData || "",
      history: [{ date: new Date().toISOString(), price: basePrice }],
    });
    saveGifts(gifts);
    form.reset();
    renderGiftTable(); loadStats(); renderCatalog();
    toast("✅ Gift qo'shildi!");
  };

  if (file && file.size > 0) {
    const reader = new FileReader();
    reader.onload = (ev) => save(ev.target.result);
    reader.readAsDataURL(file);
  } else save("");
}

/* ============================================================
   JADVAL
   ============================================================ */
function renderGiftTable() {
  const gifts = loadGifts();
  const tb = document.querySelector("#giftTable tbody");
  if (!tb) return;
  tb.innerHTML = "";

  if (!gifts.length) {
    tb.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-soft);padding:30px">Hozircha giftlar yo'q</td></tr>`;
    return;
  }

  gifts.forEach(g => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${g.image ? `<img src="${g.image}">` : "🎁"}</td>
      <td><b>${g.name}</b></td>
      <td style="color:var(--text-soft)">${g.base_price} ⭐</td>
      <td><input type="number" value="${g.current_price}" onchange="updatePrice(${g.id}, this.value)"></td>
      <td><input type="number" value="${g.count}" onchange="updateCount(${g.id}, this.value)"></td>
      <td><button class="danger" onclick="delGift(${g.id})">🗑 O'chirish</button></td>`;
    tb.appendChild(tr);
  });
}

/* ============================================================
   YANGILASH / O'CHIRISH
   ============================================================ */
function updatePrice(id, price) {
  price = parseFloat(price);
  if (isNaN(price)) return;
  const gifts = loadGifts();
  const g = gifts.find(x => x.id === id);
  if (!g) return;
  if (g.current_price !== price) {
    g.current_price = price;
    g.history = g.history || [];
    g.history.push({ date: new Date().toISOString(), price });
  }
  saveGifts(gifts);
  renderGiftTable(); renderCatalog();
  toast("💰 Narx yangilandi");
}
function updateCount(id, count) {
  count = parseInt(count) || 0;
  const gifts = loadGifts();
  const g = gifts.find(x => x.id === id);
  if (!g) return;
  g.count = count;
  saveGifts(gifts);
  renderGiftTable(); renderCatalog();
  toast("📦 Soni yangilandi");
}
function delGift(id) {
  if (!confirm("Rostdan o'chirmoqchimisiz?")) return;
  let gifts = loadGifts();
  gifts = gifts.filter(g => g.id !== id);
  saveGifts(gifts);
  renderGiftTable(); loadStats(); renderCatalog();
  toast("🗑 O'chirildi");
}

/* ============================================================
   EXPORT / CLEAR
   ============================================================ */
function exportData() {
  const data = {
    gifts: loadGifts(),
    visits: JSON.parse(localStorage.getItem(LS_VISITS)) || [],
    users: loadUsers(),
    exported_at: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "gift_monitor_backup.json"; a.click();
  URL.revokeObjectURL(url);
  toast("⬇️ Yuklab olindi");
}
function clearAll() {
  if (!confirm("HAMMA ma'lumot o'chiriladi! Davom etilsinmi?")) return;
  localStorage.removeItem(LS_GIFTS);
  localStorage.removeItem(LS_VISITS);
  renderGiftTable(); renderCatalog(); loadStats(); renderUsers();
  toast("🗑 Hammasi o'chirildi");
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

/* ============================================================
   START
   ============================================================ */
window.addEventListener("DOMContentLoaded", () => {
  // iOS status bar uchun
  document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');

  const theme = localStorage.getItem(LS_THEME) || "light";
  applyTheme(theme);
  trackVisit();

  if (sessionStorage.getItem(LS_AUTH)) {
    openMain();
  } else {
    document.getElementById("loginUser")?.focus();
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });
});
